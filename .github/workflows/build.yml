name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Prepare Gradle Wrapper
      run: |
        cd android
        if [ ! -s gradlew ]; then
          echo "❌ Ошибка: Файл gradlew отсутствует или пуст."
          exit 1
        fi
        sed -i 's/\r$//' gradlew
        chmod +x gradlew
        echo "✅ Gradle Wrapper подготовлен."

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Chatora-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
